<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EVE - Enterprise Virtual Expert</title>


    <link rel="stylesheet"
          href="/static/css/style.css">


    <link rel="stylesheet"
          href="/static/css/sidebar.css">


</head>


<body>


<div class="app">



    <!-- ========================================= -->
    <!-- Sidebar -->
    <!-- ========================================= -->

    <aside class="sidebar">



        <!-- LOGO MMSGI -->

        <div class="logo">


            <img

                src="/static/images/logo.png"

                alt="MMSGI Logo"

                class="logo-image">

            <!-- <img
                src="/static/images/eve.png"
                alt="EVE Logo"
                class="logo-image"> -->


        </div>





        <!-- NEW CHAT -->

        <button

            id="new-chat-btn"

            class="new-chat-btn">


            ＋ New Chat


        </button>





        <!-- SEARCH -->

        <div class="search-box">


            <input

                id="search-chat"

                type="text"

                placeholder="Cari percakapan...">


        </div>


        <!-- HISTORY -->

        <div

            id="chat-history"

            class="history-list">


        </div>





        <!-- FOOTER -->

        <div class="sidebar-footer">


            <div class="sidebar-menu">


                ⚙ Settings


            </div>



            <div class="sidebar-menu">


                👤 User


            </div>



        </div>



    </aside>






    <!-- ========================================= -->
    <!-- Main Content -->
    <!-- ========================================= -->


    <!-- <main class="main-content"> -->
    <main class="main-content initial-state">


        <!-- HEADER -->

        <header class="header">


            <div>


                <h1>

                    EVE

                </h1>


                <small>

                    Enterprise Virtual Expert

                </small>


            </div>



            <div class="model-selector">

                <select id="model-select">
                    <option value="">Loading model...</option>
                </select>

            </div>


            <div class="version">

                v1.0

            </div>


        </header>

            <div class="active-model-bar">

                <!-- <span>🤖</span> -->
                 <span class="model-icon">
                    <svg width="15" height="15" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                        <rect x="8" y="8" width="8" height="8" rx="1"></rect>
                        <line x1="9" y1="1" x2="9" y2="4"></line>
                        <line x1="15" y1="1" x2="15" y2="4"></line>
                        <line x1="9" y1="20" x2="9" y2="23"></line>
                        <line x1="15" y1="20" x2="15" y2="23"></line>
                    </svg>
                </span>

                <span>Model:</span>

                <strong id="active-model-name">
                    Loading...
                </strong>

            </div>





        <!-- CHAT AREA -->


        <section

            id="chat-box"

            class="chat-box">

<!-- 

            <div class="welcome">


                <div class="welcome-icon">

                    <img

                </div>



                <h2>

                </h2>



                <p>


                    Saya siap membantu Anda mencari informasi mengenai:


                </p>



                <ul>


                    <li>
                        📘 Employee Handbook

                    <li>
                        📄 SOP
                    </li>


                    <li>

                    </li>


                    <li>

                </ul>



                <div class="tips">


                    Mulailah dengan mengetik pertanyaan di bawah.


                </div>



            </div> -->



        </section>

        
        <!-- INPUT -->


        <footer class="input-container">



            <div class="input-wrapper">



                <textarea

                    id="question"

                    rows="1"

                    placeholder="Tanyakan SOP, Employee Handbook, SK Direksi, Kebijakan...">


                </textarea>


                <button

                    id="send-btn">


                    ➤


                </button>




            </div>





            <div class="input-note">


                Enter = Kirim &nbsp;&nbsp;&nbsp;

                Shift + Enter = Baris Baru



            </div>



        </footer>


    </main>





</div>





<!-- JavaScript -->


<script src="/static/js/app.js"></script>

<script src="/static/js/sidebar.js"></script>
